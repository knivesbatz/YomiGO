<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { width: 300px; margin: 0; padding: 12px; background: #fdf6f3; color: #34202a; font: 14px/1.45 system-ui, "Noto Sans JP", sans-serif; }
h1 { font-size: 16px; margin: 0 0 8px; color: #c2436b; }
button { display: block; width: 100%; min-height: 36px; margin-top: 6px; border-radius: 8px; border: 1px solid #c2436b; background: #fff; color: #34202a; cursor: pointer; }
label { display: block; margin: 8px 0; } li { margin-bottom: 4px; } ul { padding-left: 18px; max-height: 180px; overflow: auto; } .dim { color: #7d6670; font-size: 12px; }
</style>
</head>
<body>
<h1>✿ YomiGo Reader</h1>
<label><input type="checkbox" id="on"> Look up selected Japanese</label>
<div id="count" class="dim"></div>
<ul id="list"></ul>
<button id="copy">Copy for YomiGo</button>
<button id="anki">Export for Anki (.tsv)</button>
<button id="clear">Clear saved words</button>
<p class="dim">Select Japanese on a page to look it up. Dictionary: about 22,000 common words from JMdict by EDRDG (CC BY-SA 4.0). Nothing leaves this browser.</p>
<script src="popup.js"></script>
</body>
</html>
